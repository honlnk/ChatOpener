plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.honlnk.chat_opener.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.honlnk.chat_opener.app'
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName '1.2.1'
    }

    // release 签名：CI 注入 KEYSTORE_FILE/KEYSTORE_PASSWORD/KEY_ALIAS 时使用固定发布密钥，
    // 保证每次构建签名一致、可覆盖安装；未注入（本地构建）时回退 debug 签名。
    signingConfigs {
        release {
            def ksPath = System.getenv('KEYSTORE_FILE')
            if (ksPath != null) {
                storeFile file(ksPath)
                storeType 'PKCS12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig(System.getenv('KEYSTORE_FILE') != null ? signingConfigs.release : signingConfigs.debug)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    testOptions {
        unitTests {
            // Robolectric 跑 Compose UI 测试需要合并资源与 Manifest
            includeAndroidResources = true
            all {
                it.useJUnit()
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'
    // 2024.09.00（ui 1.7.1）有 LazyColumn 区域触摸派发回归（issuetracker 365802571 家族），
    // 症状：列表内按钮点击无反应。2024.12.01 = ui 1.7.6 / material3 1.3.1，同线修复版
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    // 仅用其 JsonElement API（逐行容错解析），不使用 @Serializable 代码生成，
    // 无 proguard 保留负担，且 JVM 单测可直接运行（org.json 在单测中是 stub）
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.1'

    testImplementation 'junit:junit:4.13.2'
    // 展开全文交互的 JVM 级 UI 回归测试（真实 Compose 布局 + 命中测试）
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    // createComposeRule() 依赖清单里的 ComponentActivity；testImplementation 的清单不会
    // 合并进被测变体，必须走 debugImplementation 让 manifest 合并（Compose 官方配方），
    // 因此 CI 的单测跑 testDebugUnitTest
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
